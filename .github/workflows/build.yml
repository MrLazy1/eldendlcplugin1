name: Build eldendlc

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile
        run: .\build.bat

      - name: Verify artifact
        run: .\verify.bat

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 10_eldendlc
          path: 10_eldendlc.dll
          if-no-files-found: error
